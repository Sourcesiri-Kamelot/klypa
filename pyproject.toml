[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klypa"
version = "0.1.0"
description = "Automatically generate multiple viral Shorts from long-form video uploads using open-source tools and AI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Helo-im.Ai", email = "contact@helo-im.ai"}
]
keywords = ["video", "automation", "shorts", "ai", "whisper", "tts", "scene-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/Sourcesiri-Kamelot/klypa"
Repository = "https://github.com/Sourcesiri-Kamelot/klypa"

[tool.setuptools]
packages = ["klypa"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=klypa --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100
